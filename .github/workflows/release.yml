# v* etiketi atıldığında macOS, Windows ve Linux paketlerini derleyip
# GitHub Releases'a taslak olarak yükler. Elle çalıştırıldığında yalnızca
# paketleri artifact olarak üretir (sürüm oluşturmaz).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    # İmza secret'ları yoksa paket ad-hoc imzalı (imzasız) üretilir.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/dgmos-drive-universal \
            target/aarch64-apple-darwin/release/dgmos-drive \
            target/x86_64-apple-darwin/release/dgmos-drive
      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # Yalnızca DG Regtech takımının (9758HUCSGY) sertifikası kabul edilir.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*(9758HUCSGY)"' | head -1 | tr -d '"')"
          test -n "$IDENTITY" || { echo "DG Regtech (9758HUCSGY) Developer ID Application sertifikası bulunamadı"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Bundle .app
        run: BIN_PATH=target/dgmos-drive-universal scripts/bundle-macos.sh
      - name: Sign .app
        if: env.SIGN_IDENTITY != ''
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" "target/release/bundle/DGMOS Drive.app"
          codesign --verify --strict --verbose=2 "target/release/bundle/DGMOS Drive.app"
      - name: Create .dmg
        run: |
          mkdir -p dist
          hdiutil create -volname "DGMOS Drive" -srcfolder "target/release/bundle/DGMOS Drive.app" \
            -ov -format UDZO "dist/DGMOS-Drive-macOS.dmg"
      - name: Sign, notarize and staple .dmg
        if: env.SIGN_IDENTITY != ''
        run: |
          codesign --force --timestamp --sign "$SIGN_IDENTITY" dist/DGMOS-Drive-macOS.dmg
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit dist/DGMOS-Drive-macOS.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m
          rm "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple dist/DGMOS-Drive-macOS.dmg
          spctl --assess --type open --context context:primary-signature --verbose dist/DGMOS-Drive-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package .zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, "pkg/DGMOS Drive" | Out-Null
          Copy-Item target/release/dgmos-drive.exe "pkg/DGMOS Drive/DGMOS Drive.exe"
          Compress-Archive -Path "pkg/DGMOS Drive" -DestinationPath dist/DGMOS-Drive-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package .tar.gz
        run: |
          PKG=pkg/dgmos-drive
          mkdir -p dist "$PKG"
          cp target/release/dgmos-drive "$PKG/"
          cp assets/icon-1024.png "$PKG/dgmos-drive.png"
          cat > "$PKG/dgmos-drive.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=DGMOS Drive
          Comment=DGMOS hesabınıza sürükle-bırak ile dosya yükleyin
          Exec=dgmos-drive
          Icon=dgmos-drive
          Categories=Utility;Network;
          DESKTOP
          sed -i 's/^ *//' "$PKG/dgmos-drive.desktop"
          tar -czf dist/DGMOS-Drive-Linux-x86_64.tar.gz -C pkg dgmos-drive
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "DGMOS Drive $GITHUB_REF_NAME" \
            --draft --generate-notes
